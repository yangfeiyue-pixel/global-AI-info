name: magazine-digest

on:
  schedule:
    # 每天 23:00 UTC = 北京时间次日 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r magazine-digest/requirements.txt
      - run: python magazine-digest/digest.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: magazine-digest/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
